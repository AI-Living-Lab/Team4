# ============================================================
# GDPO 세분화 reward(sep2) + gradient accumulation, **clip-higher OFF (μ=1)** config
#   gdpo_trainer_clip2_sep.py + reward_functions_rM_sep2.py 전용. GPU 2개 기준.
#
#   배경: LR 5e-6 에선 한 step policy 변화가 작아 ratio 가 clip 경계(±20~28%)에 거의 안 닿음
#         → clip-higher 가 사실상 무의미. 그래서 **μ=1 로 clip 끄고 순수 GDPO + 큰 배치**로 간다.
#         (block-repeat sampler 의 grad_accum 지원만 사용: effective batch = grad_accum × num_gpu)
#
#   4채널 [format, len, global, local] + [sep2] multi_seg_weight + [lm_head 학습].
# ------------------------------------------------------------
#   [공식] μ=1 이므로:
#     effective batch(distinct prompt/step) = grad_accum(N) × num_gpu = 2 × 2 = 4
#     고유 prompt 총량        = max_steps × N × num_gpu / μ = 1000 × 2 × 2 / 1 = 4000
#     체크포인트 간격(prompt) = save_steps × N × num_gpu / μ = 100 × 2 × 2 / 1 = 400 (→ 10 ckpt)
#   ⚠️ μ=1 → rollout 재사용 없음 → 캐시 ~1개 → 메모리 여유(μ=2 대비). GC=false 로 충분.
# ============================================================
#
# ▶▶ 실행 (GPU 2개) ◀◀
#   export CUDA_VISIBLE_DEVICES=0,1
#   torchrun --standalone --nproc_per_node=2 \
#       _tools/GDPO/gdpo_trainer_clip2_sep.py --config <이 파일> --model_path ... --model_base ... --dataset_path ...
#   (1 GPU 면 grad_accum=4 로 올려 effective batch 4 유지 가능)

# 모델 설정
model:
  model_path: ${SFT_CKPT}
  model_base: ${BASE_MODEL}
  tti_mode: "on"

# 데이터 설정
data:
  dataset_path: ${TRAIN_DIR}/unav100_v2.json

# Target Modules
lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  train_embeddings: false                   # embed OFF
  train_lm_head: true                       # q/k/v/o LoRA + lm_head 학습

# GDPO 설정
gdpo:
  num_generations: 8
  max_completion_length: 256
  beta: 0.00
  temperature: 1.0
  reward_weights: [1.0, 1.0, 1.0, 1.0]     # [format, len, global, local]
  multi_seg_weight: 1.5                     # GT>=2 prompt advantage ×w (single prior 상쇄). 1.0=off

# clip-higher: OFF (μ=1 → 순수 GDPO)
clip:
  enabled: false
  epsilon: 0.2
  epsilon_high: 0.28
  num_iterations: 1      # μ=1 → rollout 재사용/clip 없음 (순수 GDPO)

# 학습 설정 (★ GPU 2개 기준)
training:
  output_dir: output/gdpo_vs2plus_clip2_sep_mu1
  num_train_epochs: 1
  max_steps: 1000                          # μ=1/N=2/2GPU → 고유 prompt = 1000×2×2/1 = 4000
  per_device_train_batch_size: 1           # ⚠️ 1 고정
  gradient_accumulation_steps: 2           # N=2 → effective batch = 2×num_gpu (2GPU=4)
  learning_rate: 5e-6
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  bf16: true
  seed: 2024
  gradient_checkpointing: false            # μ=1 → 캐시 1개 → 메모리 여유. OOM 시 true
  gradient_checkpointing_kwargs:
    use_reentrant: false

# 저장/로깅
logging:
  logging_steps: 1
  save_steps: 100                          # 400 고유 prompt 마다 저장 (10 ckpt)
  save_total_limit: 10
  report_to: wandb
  run_name: null

# reward 설정
reward:
  module: reward_functions_rM_sep2

# ref 모델
ref_model:
  enabled: true
