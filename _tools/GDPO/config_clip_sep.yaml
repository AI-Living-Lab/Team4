# ============================================================
# GDPO 학습신호 세분화(separated reward) + clip-higher 실험 config
#   ▶ 이 파일은 **단일 GPU (A100) 기준**으로 설정돼 있습니다.
#
#   reward_functions_rM_sep.py 전용. config_clip.yaml 사본 + 아래만 다름:
#     1) reward.module        : reward_functions_rM_sep
#     2) gdpo.reward_weights  : 4채널 [format, len, global, local]
#     3) output_dir           : .../gdpo_vs2plus_sep
#
#   목적(multi-segment 붕괴 대응):
#     - global = MUSEG F1(precision 내장) → '한 개 큰 세그먼트' attractor 제거
#     - len + local(채널 분리) → 개수/위치 신호를 GDPO 채널별 정규화로 보존·증폭
#     - clip-higher(μ=2) → 탐색 유지로 엔트로피/세그먼트 붕괴 지연 (reward 예방 + 탐색 치료)
#
#   ⚠️ 채널 호환: trainer 의 load_reward_module 이 reward_functions_rM_sep.REWARD_CHANNELS
#      를 그대로 사용한다(임의 채널 수/이름). reward_weights 길이는 채널 수에 자동 정렬됨.
#   ⚠️ len 채널은 기본 binary. near-collapse gradient 가 필요하면 env LEN_REWARD_MODE=graded.
#
#   모델/데이터 경로는 CLI(--model_path/--model_base/--dataset_path)로 직접 전달.
# ------------------------------------------------------------
#   [핵심 공식] 단일 GPU + μ>1 에선 distinct-prompt 배치를 1보다 못 올림
#     (per_device=1 고정, grad_accum=1 은 μ>1 필수 → 배치 레버 없음).
#     고유 prompt 수      = max_steps × num_gpu / μ
#     체크포인트 간격(prompt) = save_steps × num_gpu / μ
#   → VRAM 여유는 num_generations↑ / gradient_checkpointing=false 로 활용.
# ============================================================
#
# ┌──────────────────────────────────────────────────────────┐
# │ ▶▶ GPU 2개로 학습할 때 수정법 (아래 본문은 1 GPU 기준) ◀◀  │
# │                                                            │
# │  실행:  torchrun --standalone --nproc_per_node=2 \         │
# │           _tools/GDPO/gdpo_trainer.py --config <이 파일> ... │
# │                                                            │
# │  바꿀 값 (고유 prompt 수 = max_steps×gpu/μ 를 동일하게 유지):│
# │    training.max_steps  : 4000 → 2000   (4000×1/2 = 2000×2/2)│
# │    logging.save_steps  :  200 →  100   (저장 간격 동일 유지)│
# │  그대로 둘 값:                                              │
# │    gradient_accumulation_steps : 1     (μ>1 필수, 절대 변경 X)│
# │    per_device_train_batch_size : 1     (trainer 가 단일 prompt 가정)│
# │    num_generations            : 8                          │
# │    gradient_checkpointing     : per-GPU 메모리라 GPU 수와 무관 │
# │       (1 GPU 에서 false 로 OK 였으면 2 GPU 에서도 false 로 OK)│
# └──────────────────────────────────────────────────────────┘

# 모델 설정
model:
  model_path: ${SFT_CKPT}
  model_base: ${BASE_MODEL}
  tti_mode: "on"

# 데이터 설정
data:
  dataset_path: ${TRAIN_DIR}/unav100_v2.json

# Target Modules
lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  train_embeddings: false

# GDPO 설정
gdpo:
  num_generations: 8                       # group 크기. VRAM 더 활용하려면 16~24 로 (붕괴 대응에도 유리)
  max_completion_length: 256
  beta: 0.00
  temperature: 1.0
  reward_weights: [1.0, 1.0, 1.0, 1.0]     # [format, len, global, local]

# DAPO clip-higher
clip:
  enabled: true
  epsilon: 0.2           # ε_low
  epsilon_high: 0.28     # ε_high (>ε_low = clip-higher)
  num_iterations: 2      # μ: 한 rollout 을 μ 번 재사용 (μ>1 이라야 clip 작동)
                         # ⚠️ μ 를 바꾸면 max_steps(=고유prompt×μ/gpu) 도 함께 수정할 것

# 학습 설정 (★ 단일 GPU / A100 기준)
training:
  output_dir: output/gdpo_vs2plus_sep
  num_train_epochs: 1
  max_steps: 4000                          # 1 GPU/μ=2/accum1 → 고유 prompt = 4000×1/2 = 2000 (v2 데이터량 일치)
                                           #   (2 GPU 면 2000 으로. CLI --max_steps 로도 override)
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1           # ⚠️ μ>1 필수 (절대 변경 X)
  learning_rate: 5e-6
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  bf16: true
  seed: 2024
  gradient_checkpointing: false            # A100 VRAM 여유 활용(속도↑). ⚠️ OOM 터지면 true 로 바꿀 것
  gradient_checkpointing_kwargs:
    use_reentrant: false

# 저장/로깅
logging:
  logging_steps: 1
  save_steps: 200                          # 자주 관찰용. 1 GPU/μ=2 → 100 고유 prompt 마다 저장
  save_total_limit: 10
  report_to: wandb
  run_name: null

# reward 설정
reward:
  module: reward_functions_rM_sep

# ref 모델
ref_model:
  enabled: true
