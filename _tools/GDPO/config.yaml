# ============================================================
# GDPO Training Configuration (VS2+ / Qwen2.5-VL)
# source paths.env
# python _tools/GDPO/gdpo_trainer.py --config _tools/GDPO/config.yaml
# ============================================================

# 모델 설정
model:
  model_path: ${SFT_CKPT}                    # SFT 체크포인트 경로 (LoRA adapter)
  model_base: ${BASE_MODEL}                  # VS2+ 베이스 모델 (time_tokens 추가됨)
  tti_mode: "off"

# 데이터 설정
data:
  dataset_path: ${TRAIN_DIR}/unav100_v2.json

# Target Modules 
lora:
  enabled: true
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  train_embeddings: true     # embed_tokens/lm_head 도 학습(modules_to_save). false 면 LoRA(q/k/v/o)만.

# GDPO 설정
gdpo:
  num_generations: 8                       # 8
  max_completion_length: 256               # 256
  beta: 0.04                               # 0.04
  temperature: 1.5
  reward_weights: [1.0, 1.0]               # [format, iou]

# 학습 설정
training:
  num_train_epochs: 1
  max_steps: 1000
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5e-6
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  bf16: true
  seed: 2024
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

# 저장/로깅
logging:
  logging_steps: 1
  save_steps: 100
  save_total_limit: 5
  report_to: wandb

# ref 모델
ref_model:
  enabled: true
