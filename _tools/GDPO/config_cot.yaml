# ============================================================
# GDPO CoT 실험 config (v8 = unav100 CoT SFT 위 RL)
#   공용 config.yaml 복사 + CoT 전용 변경분만. (공용은 미수정)
#   사용: gdpo_trainer.py --config config_cot.yaml --model_path <v8 ckpt> --model_base <time_tokens base>
#   reward_weights [format, iou, timestamp, modality]:
#     A(fp02 baseline) = [1,1,0,0] (가드 off) / B(가드 on) = [1,1,0.5,0.5]
# ============================================================

model:
  model_path: ${SFT_CKPT}        # CLI --model_path 로 v8 ckpt-250 어댑터 지정
  model_base: ${BASE_MODEL}      # CLI --model_base 로 video_salmonn2_plus_7B_time_tokens 지정
  tti_mode: "on"                 # v8 가 special_token 으로 학습됨 → on 필수

data:
  dataset_path: ${TRAIN_DIR}/unav100_v2_cot.json   # CoT 프롬프트 데이터

lora:
  enabled: true                  # ★ 경로 B(머지본 salmonn2p_7b_unav_v8 위 fresh LoRA)
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  train_embeddings: false        # ★ embed/lm_head freeze → 메모리 절약 (경로 B 네이티브 지원)

gdpo:
  num_generations: 8
  max_completion_length: 256     # OOM 회피 + 폭주(endless think) 억제. (잘리면 384 시도)
  beta: 0.00
  temperature: 1.0
  reward_weights: [1.0, 1.0, 0.5, 0.5]   # B=가드 on [format, iou, timestamp, modality]

training:
  output_dir: output/gdpo_vs2plus
  num_train_epochs: 1
  max_steps: 500
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2   # 2-GPU DDP → effective batch 4 (1-GPU 스모크면 무관)
  learning_rate: 5e-6
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  bf16: true
  seed: 2024
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

logging:
  logging_steps: 1
  save_steps: 100
  save_total_limit: 10
  report_to: wandb
  run_name: null

reward:
  module: reward_functions_rM_fp_cot   # CoT 4채널 (format,iou,timestamp,modality). A는 weight로 뒤 2개 off

ref_model:
  enabled: true
