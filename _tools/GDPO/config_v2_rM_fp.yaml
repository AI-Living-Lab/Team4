# ============================================================
# GDPO non-CoT 실험 config (v2 / rM_fp, FP penalty)
#   공용 config.yaml 복사 + 2-GPU 전용 변경분만. (공용은 미수정)
#   reward_functions_rM_fp = 2채널 [format, iou(r_M - K*FP)]
#   FP_PENALTY_K 는 env 로 주입 (기본 0.2).
#   사용: gdpo_trainer.py --config config_v2_rM_fp.yaml --model_path <v8 머지본> --model_base <동일>
# ============================================================

model:
  model_path: ${SFT_CKPT}        # CLI --model_path 로 v8 머지본 지정
  model_base: ${BASE_MODEL}      # CLI --model_base 로 동일 경로 지정 (경로B)
  tti_mode: "on"

data:
  dataset_path: ${TRAIN_DIR}/unav100_v2.json   # non-CoT (plain) 데이터

lora:
  enabled: true                  # 경로 B (머지본 위 fresh LoRA)
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  train_embeddings: false        # embed/lm_head freeze (embed-off)

gdpo:
  num_generations: 8
  max_completion_length: 256
  beta: 0.00
  temperature: 1.0
  reward_weights: [1.0, 1.0]     # 2채널 [format, iou]

training:
  output_dir: output/gdpo_vs2plus
  num_train_epochs: 1
  max_steps: 500
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2   # 2-GPU DDP → effective batch 4
  learning_rate: 5e-6
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  bf16: true
  seed: 2024
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

logging:
  logging_steps: 1
  save_steps: 100
  save_total_limit: 5
  report_to: wandb
  run_name: null

reward:
  module: reward_functions_rM_fp   # 2채널 (format, iou+FP penalty). CLI 로도 override 가능

ref_model:
  enabled: true
